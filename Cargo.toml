[package]
name = "hushhour"
version = "0.4.0"
license = "MIT"
description = "A quiet Markdown editor for Linux"
repository = "https://github.com/50hoursaweek/hushhour"
edition = "2024"

[workspace]
members = ["core"]

[dependencies]
hushhour-core = { path = "core" }
# Writes the PNG for `--screenshot=`; the same version iced already pulls in.
image = "0.25"
cosmic-text = "0.15"
dirs = "6"
iced = { version = "0.14", features = ["advanced", "tokio", "image"] }
libloading = "0.9.0"
raw-window-handle = "0.6"
rfd = "0.17"
smol_str = "0.2"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

# Keep debug builds responsive: optimise dependencies (wgpu, cosmic-text) even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
