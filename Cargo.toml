[package]
name = "inkpad"
version = "0.1.1"
license = "MIT"
description = "A quiet Markdown editor for Linux"
repository = "https://github.com/50hoursaweek/inkpad"
edition = "2024"

[dependencies]
cosmic-text = "0.15"
dirs = "6"
iced = { version = "0.14", features = ["advanced", "tokio", "image"] }
libloading = "0.9.0"
pulldown-cmark = "0.13"
raw-window-handle = "0.6"
rfd = "0.17"
smol_str = "0.2"
symphonia = { version = "0.5", features = ["mp3"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

# Keep debug builds responsive: optimise dependencies (wgpu, cosmic-text) even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
