# Flatpak manifest. Build and install locally with:
#   flatpak run org.flatpak.Builder --user --install --force-clean build-dir packaging/io.github._50hoursaweek.inkpad.yml
app-id: io.github._50hoursaweek.inkpad
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: inkpad
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio through the sound server (ALSA inside the sandbox routes to it).
  - --socket=pulseaudio
  # Files are opened and saved through the file-chooser portal; no filesystem access needed.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/inkpad/cargo
modules:
  - name: inkpad
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/inkpad /app/bin/inkpad
      - install -Dm644 packaging/io.github._50hoursaweek.inkpad.desktop /app/share/applications/io.github._50hoursaweek.inkpad.desktop
      - install -Dm644 packaging/io.github._50hoursaweek.inkpad.metainfo.xml /app/share/metainfo/io.github._50hoursaweek.inkpad.metainfo.xml
      - install -Dm644 assets/inkpad-icon-4a.svg /app/share/icons/hicolor/scalable/apps/io.github._50hoursaweek.inkpad.svg
      - install -Dm644 assets/icon-256.png /app/share/icons/hicolor/256x256/apps/io.github._50hoursaweek.inkpad.png
      - install -Dm644 assets/icon-512.png /app/share/icons/hicolor/512x512/apps/io.github._50hoursaweek.inkpad.png
      - mkdir -p /app/share/inkpad/music && cp assets/music/*.* /app/share/inkpad/music/
    sources:
      - type: git
        url: https://github.com/50hoursaweek/inkpad.git
        tag: v0.1.2
        commit: 49a460f518988645fe4900071216258ce13ce353
      - cargo-sources.json
