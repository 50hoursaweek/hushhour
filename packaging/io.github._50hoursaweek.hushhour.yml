# Flatpak manifest, built from this checkout. Build and install locally with:
#   flatpak run org.flatpak.Builder --user --install --force-clean build-dir packaging/io.github._50hoursaweek.hushhour.yml
# Releases attach a single-file bundle made from it (packaging/build-flatpak.sh).
app-id: io.github._50hoursaweek.hushhour
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: slowpage
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio through the sound server (ALSA inside the sandbox routes to it).
  - --socket=pulseaudio
  # Files are opened and saved through the file-chooser portal; no filesystem access needed.
  # Network only for the optional daily update check (one request to github.com): a bundle
  # installed from the GitHub release is not updated by `flatpak update`.
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/slowpage/cargo
    # Reproducible: the About dialog shows this instead of a local build counter.
    SLOWPAGE_BUILD: flatpak
modules:
  - name: slowpage
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/slowpage /app/bin/slowpage
      - install -Dm644 packaging/io.github._50hoursaweek.hushhour.desktop /app/share/applications/io.github._50hoursaweek.hushhour.desktop
      - install -Dm644 packaging/io.github._50hoursaweek.hushhour.metainfo.xml /app/share/metainfo/io.github._50hoursaweek.hushhour.metainfo.xml
      - install -Dm644 assets/hushhour-icon.svg /app/share/icons/hicolor/scalable/apps/io.github._50hoursaweek.hushhour.svg
      - install -Dm644 assets/icon-256.png /app/share/icons/hicolor/256x256/apps/io.github._50hoursaweek.hushhour.png
      - install -Dm644 assets/icon-512.png /app/share/icons/hicolor/512x512/apps/io.github._50hoursaweek.hushhour.png
      - mkdir -p /app/share/slowpage/music && cp assets/music/*.* /app/share/slowpage/music/
      - mkdir -p /app/share/licenses/slowpage/fonts /app/share/licenses/slowpage/sounds
      - install -Dm644 LICENSE /app/share/licenses/slowpage/LICENSE
      - install -Dm644 packaging/LICENSE-iced.txt /app/share/licenses/slowpage/LICENSE-iced.txt
      - cp assets/fonts/LICENSE-*.txt assets/fonts/LICENSE-Lato.md assets/fonts/README.md /app/share/licenses/slowpage/fonts/
      - cp assets/sounds/README.md /app/share/licenses/slowpage/sounds/README.md
      - printf 'Music loops generated with Google Lyria 3 (AI, SynthID watermark).\nDedicated to the public domain under CC0, to the extent any rights exist.\nThey are the files in share/slowpage/music.\n' > /app/share/licenses/slowpage/MUSIC-CC0.txt
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - dist
          - build-dir
          - .flatpak-builder
          - .git
          - .claude
          - .env
      - cargo-sources.json
