[package]
name = "hushhour-core"
version = "0.6.0"
license = "MIT"
description = "The platform-independent heart of HushHour: Markdown scanning, statistics, undo history, soundscapes and file decoding"
repository = "https://github.com/50hoursaweek/hushhour"
edition = "2024"

[dependencies]
dirs = "6"
pulldown-cmark = { version = "0.13", default-features = false }
symphonia = { version = "0.5", features = ["mp3"] }
