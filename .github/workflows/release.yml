# Builds the release AppImage on the oldest supported Ubuntu, so the binary runs on
# any distribution with glibc 2.35 or newer, and attaches it to the GitHub release.
name: Release AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the AppImage to (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the tests
        env:
          INKPAD_BUILD: ci-${{ github.run_number }}
        run: cargo test --locked

  appimage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual dispatch with a tag builds exactly that tag, never the branch it was started from.
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          expected=${TAG#v}
          actual=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "tag $TAG, Cargo.toml version $actual, commit $(git rev-parse HEAD)"
          [ "$expected" = "$actual" ] || { echo "version mismatch" >&2; exit 1; }
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2 file
          curl -sSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the AppImage
        env:
          # The About dialog shows this instead of the local build counter.
          INKPAD_BUILD: ci-${{ github.run_number }}
        run: bash packaging/build-appimage.sh
      - name: Check the glibc requirement
        run: |
          max=$(objdump -T target/release/inkpad | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "highest glibc symbol version: $max (supported maximum: GLIBC_2.35)"
          [ "$(printf '%s\n' "$max" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ] || { echo "binary needs a newer glibc than the baseline" >&2; exit 1; }
      # The self-test needs a display and a GPU, which the runner lacks; the glibc
      # check above and the local self-test before tagging cover the release.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          version=${TAG#v}
          cp dist/Inkpad-x86_64.AppImage "Inkpad-${version}-x86_64.AppImage"
          gh release upload "$TAG" "Inkpad-${version}-x86_64.AppImage" --clobber
