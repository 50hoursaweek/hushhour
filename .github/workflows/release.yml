# Builds the release AppImage on the oldest supported Ubuntu, so the binary runs on
# any distribution with glibc 2.35 or newer, and attaches it to the GitHub release.
name: Release AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2 file
          curl -sSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the AppImage
        env:
          # The About dialog shows this instead of the local build counter.
          INKPAD_BUILD: ci-${{ github.run_number }}
        run: bash packaging/build-appimage.sh
      - name: Check the glibc requirement
        run: |
          max=$(objdump -T target/release/inkpad | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "highest glibc symbol version: $max"
      - name: Self-test the AppImage
        run: ./dist/Inkpad-x86_64.AppImage --appimage-extract-and-run --selftest
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          cp dist/Inkpad-x86_64.AppImage "Inkpad-${version}-x86_64.AppImage"
          gh release upload "$GITHUB_REF_NAME" "Inkpad-${version}-x86_64.AppImage" --clobber
